# Dependabot configuration for Candela
# Automatically checks and updates Docker base image digests and GitHub Actions
version: 2
updates:
  # Dockerfiles at repository root (Dockerfile.proxy, Dockerfile.sidecar, Dockerfile.ci)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "supply-chain"
      - "dependencies"

  # Production and deploy Dockerfiles in deploy/
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "supply-chain"
      - "dependencies"

  # E2E test client Dockerfile
  - package-ecosystem: "docker"
    directory: "/test/e2e/client"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "supply-chain"
      - "dependencies"

  # E2E Tetragon test runner Dockerfile
  - package-ecosystem: "docker"
    directory: "/test/e2e/tetragon/test-runner"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "supply-chain"
      - "dependencies"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
      - "dependencies"
