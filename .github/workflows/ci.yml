name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read        # pull ghcr.io/candelahq/candela-dev
  pull-requests: read   # dorny/paths-filter needs PR file list

# All jobs run inside the pre-baked CI container:
#   Ubuntu 24.04 + Determinate Nix + dev shell pre-warmed in Nix store.
# Steps use `nix develop . --command <cmd>` — identical to local dev.
# Rebuild the image via dev-container.yml when flake.nix / flake.lock changes.

jobs:
  # ── change detection ─────────────────────────────────────────────────────────
  # Detects which tracks (go/rust/ui) are affected by the PR.
  # Push to main always runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ github.event_name == 'push' || steps.filter.outputs.go }}
      rust: ${{ github.event_name == 'push' || steps.filter.outputs.rust }}
      ui: ${{ github.event_name == 'push' || steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            go:
              - 'pkg/**'
              - 'cmd/**'
              - 'go.mod'
              - 'go.sum'
              - 'gen/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
              - 'flake.nix'
              - 'flake.lock'
              - 'Dockerfile.ci'
            rust:
              - 'rust/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
              - 'flake.nix'
              - 'flake.lock'
              - 'Dockerfile.ci'
            ui:
              - 'ui/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
              - 'flake.nix'
              - 'flake.lock'
              - 'Dockerfile.ci'

  # ── build, vet, and lint ────────────────────────────────────────────────────
  build-and-lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/candelahq/candela-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Fix git ownership for Nix flake
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Lint GitHub Actions workflows
        run: nix develop . --command actionlint

      - name: Generate proto stubs
        run: nix develop . --command buf generate

      - name: Verify generated code is up-to-date
        run: |
          nix develop . --command bash -c '
            git add -N -- gen/ ui/src/gen/
            if ! git diff --exit-code -- gen/ ui/src/gen/; then
              echo "::error::Generated code is out of date. Run buf generate and commit the results."
              git diff --stat -- gen/ ui/src/gen/
              exit 1
            fi
          '

      - name: Download modules
        run: |
          nix develop . --command bash -c "
            for attempt in 1 2 3; do
              go mod download && break
              echo \"::warning::go mod download failed (attempt \$attempt/3), retrying...\"
              sleep 5
            done
            go mod download || { echo \"::error::go mod download failed after 3 retries\"; exit 1; }
          "

      - name: Build
        run: nix develop . --command go build ./...

      - name: Vet
        run: nix develop . --command go vet ./...

      - name: Lint
        run: nix develop . --command golangci-lint run --timeout=5m

  # ── tests — parallel matrix by package group ────────────────────────────────
  go-test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/candelahq/candela-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      FIRESTORE_EMULATOR_HOST: localhost:8086
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: cmd
            pkgs: ./cmd/candela/... ./cmd/candela-sidecar/...
          - name: pkg-core
            pkgs: ./pkg/auth/... ./pkg/connecthandlers/... ./pkg/costcalc/... ./pkg/notify/... ./pkg/proxy/... ./pkg/runtime/... ./pkg/session/...
          - name: pkg-storage
            pkgs: ./pkg/storage/...
          - name: pkg-processor
            pkgs: ./pkg/processor/... ./pkg/prototest/...
          - name: pkg-observability
            pkgs: ./pkg/hubbleaudit/... ./pkg/tetragonaudit/... ./pkg/transparent/...
          - name: pkg-auxiliary
            pkgs: ./pkg/anomaly/... ./pkg/attribution/... ./pkg/audit/... ./pkg/billing/... ./pkg/catalog/... ./pkg/cloudauth/... ./pkg/ingestion/... ./pkg/otel/...
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Fix git ownership for Nix flake
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Start Firestore emulator
        run: |
          nix develop . --command bash -c "
            gcloud emulators firestore start \
              --host-port=0.0.0.0:8086 \
              --project=test-project &
            for _ in \$(seq 1 30); do
              curl -sf http://localhost:8086/ && break
              sleep 2
            done
          "

      - name: Generate proto stubs
        run: nix develop . --command buf generate

      - name: Download modules
        run: |
          nix develop . --command bash -c "
            for attempt in 1 2 3; do
              go mod download && break
              echo \"::warning::go mod download failed (attempt \$attempt/3), retrying...\"
              sleep 5
            done
            go mod download || { echo \"::error::go mod download failed after 3 retries\"; exit 1; }
          "

      - name: Test (${{ matrix.group.name }})
        run: nix develop . --command go test ${{ matrix.group.pkgs }} -v -race -count=1 -p 4 -parallel 4 -coverprofile=coverage-${{ matrix.group.name }}.out -timeout 180s

      - name: Upload coverage (${{ matrix.group.name }})
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ matrix.group.name }}
          path: coverage-${{ matrix.group.name }}.out
          retention-days: 1

  # ── merge coverage and govulncheck ──────────────────────────────────────────
  build-and-test:
    needs: [changes, go-test]
    if: always() && needs.changes.outputs.go == 'true' && needs.go-test.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/candelahq/candela-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Fix git ownership for Nix flake
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download coverage artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Merge coverage profiles
        shell: bash
        run: |
          files=(coverage-*.out)
          head -1 "${files[0]}" > coverage.out
          for f in "${files[@]}"; do
            tail -n +2 "$f" >> coverage.out
          done

      - name: Coverage summary
        run: nix develop . --command go tool cover -func=coverage.out | tail -1

      - name: govulncheck
        continue-on-error: true
        run: nix develop . --command govulncheck ./...

  # ── Windows native CLI smoke ────────────────────────────────────────────────
  windows-candela:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          args: --timeout=5m
          skip-cache: true

      - name: Test Windows-relevant packages
        shell: pwsh
        run: go test -v ./cmd/candela/... ./pkg/runtime/... -count=1

      - name: Build candela.exe (windows/amd64)
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o candela-windows.exe ./cmd/candela

      - name: Build candela.exe (windows/arm64)
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "arm64"
          go build -o candela-windows-arm64.exe ./cmd/candela

  # ── UI build + lint ─────────────────────────────────────────────────────────
  ui-build-and-lint:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/candelahq/candela-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Fix git ownership for Nix flake
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: nix develop . --command pnpm install
        working-directory: ui

      - name: Generate TS proto stubs
        run: nix develop . --command buf generate

      - name: Verify generated TS code is up-to-date
        run: |
          nix develop . --command bash -c '
            git add -N -- ui/src/gen
            if ! git diff --exit-code -- ui/src/gen; then
              echo "::error::Generated TS code is out of date. Run buf generate and commit the results."
              git diff --stat -- ui/src/gen
              exit 1
            fi
          '

      - name: Lint
        run: nix develop . --command pnpm run lint
        working-directory: ui

      - name: Build
        run: nix develop . --command pnpm run build
        working-directory: ui

  # ── UI E2E ──────────────────────────────────────────────────────────────────
  ui-e2e:
    needs: [changes, ui-build-and-lint]
    if: always() && needs.changes.outputs.ui == 'true' && needs.ui-build-and-lint.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/candelahq/candela-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Fix git ownership for Nix flake
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: nix develop . --command pnpm install
        working-directory: ui

      - name: Generate TS proto stubs
        run: nix develop . --command buf generate

      - name: Install Playwright browsers
        run: nix develop . --command pnpm exec playwright install --with-deps chromium
        working-directory: ui

      - name: Run Playwright tests
        run: nix develop . --command pnpm exec playwright test
        working-directory: ui
        env:
          CI: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

  # ── Rust check ──────────────────────────────────────────────────────────────
  rust-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/candelahq/candela-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Fix git ownership for Nix flake
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate Rust proto stubs
        run: nix develop . --command bash -c "cd rust && buf generate"

      - name: Format check
        run: nix develop . --command bash -c "cd rust && cargo fmt --check"

      - name: Clippy
        run: nix develop . --command bash -c "cd rust && cargo clippy --workspace -- -D warnings"

      - name: Test
        run: nix develop . --command bash -c "cd rust && cargo test --workspace"

      - name: License & vulnerability audit
        continue-on-error: true
        run: nix develop . --command bash -c "cd rust && cargo deny check"

  # ── Transparent proxy E2E (Linux + iptables) ────────────────────────────────
  transparent-proxy-e2e:
    runs-on: ubuntu-latest
    # Only run when proxy/transparent/e2e files change.
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.title, 'transparent') ||
      contains(github.event.pull_request.title, 'ebpf') ||
      contains(github.event.pull_request.title, 'proxy')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Generate self-signed certs
        run: |
          chmod +x test/e2e/gen-certs.sh
          cd test/e2e && ./gen-certs.sh

      - name: Run transparent proxy E2E
        run: |
          docker compose -f test/e2e/docker-compose.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from test-client
        timeout-minutes: 5

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f test/e2e/docker-compose.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f test/e2e/docker-compose.yml down -v
