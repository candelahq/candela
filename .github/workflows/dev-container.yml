name: Dev Container

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.ci
      - flake.nix
      - flake.lock
  # Allow manual trigger to rebuild the image on demand.
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # needed to push to GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: ghcr.io/candelahq/candela-dev:latest
          # Cache layers between builds — only the flake layer is invalidated
          # when flake.nix / flake.lock changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: echo "✅ Pushed ghcr.io/candelahq/candela-dev:latest"
