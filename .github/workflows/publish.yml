# Candela — Publish Server Image
#
# Builds the universal candela-server container and pushes to GHCR.
# No deployment-specific config — deployers pull this image and run it
# with their own environment variables.
#
# The UI container (candela-ui) is NOT published here — each deployer
# builds it with their own Firebase config via deploy/Dockerfile.ui.
#
# Images:
#   ghcr.io/candelahq/candela-server:<sha>
#   ghcr.io/candelahq/candela-server:latest   (main branch only)
#   ghcr.io/candelahq/candela-server:v*        (tagged releases)

name: Publish

on:
  # Trigger after CI workflow completes successfully on main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # Manual trigger for ad-hoc publishes.
  workflow_dispatch:

  # Publish on version tags.
  push:
    tags: ["v*"]

# Cancel in-flight publishes when a new commit lands on main.
concurrency:
  group: publish-server
  cancel-in-progress: true

permissions:
  contents: read
  packages: write          # Required to push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: candelahq/candela-server

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run if CI succeeded (or if manually triggered / tag push).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # For workflow_run, check out the commit that triggered CI.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@2559b44fed7d4fc978e8dd0e379661afb8b73590 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate proto stubs (from BSR)
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: nix develop -c buf generate

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # SHA tag on every build
            type=sha,prefix=,format=short
            # latest on main
            type=raw,value=latest,enable={{is_default_branch}}
            # Semver tags on version pushes
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache disabled: GHA cache caused stale binaries to ship without
          # security fixes (v0.7.1 incident). Build time (~2 min) is acceptable.
