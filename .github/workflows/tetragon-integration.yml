# Tetragon Integration Test
#
# Runs the docker-compose based integration test with a real Tetragon agent.
# This validates the full eBPF event pipeline end-to-end:
#   - Real kernel kprobe event generation
#   - Tetragon gRPC export API
#   - Event schema fidelity against tetragonaudit.Event
#
# Gated to:
#   - Manual trigger (workflow_dispatch)
#   - Pushes/PRs touching the tetragonaudit package or e2e test infra

name: Tetragon Integration

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'pkg/tetragonaudit/**'
      - 'test/e2e/tetragon/**'
  pull_request:
    paths:
      - 'pkg/tetragonaudit/**'
      - 'test/e2e/tetragon/**'

concurrency:
  group: tetragon-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tetragon-e2e:
    name: Tetragon E2E
    # Pin ubuntu-24.04 (Linux 6.8); ubuntu-26.04 (Linux 7.0+) rejects tetragon v1.3.0's bpf_multi_kprobe_v61.o.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Docker Compose
        run: docker compose version

      - name: Run Tetragon Integration Test
        run: |
          docker compose \
            -f test/e2e/tetragon/docker-compose.yml \
            up \
            --build \
            --abort-on-container-exit \
            --exit-code-from test-runner
        timeout-minutes: 10

      - name: Collect Tetragon Logs
        if: always()
        run: |
          docker compose \
            -f test/e2e/tetragon/docker-compose.yml \
            logs tetragon > tetragon-agent.log 2>&1 || true
          docker compose \
            -f test/e2e/tetragon/docker-compose.yml \
            logs test-runner > test-runner.log 2>&1 || true

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tetragon-integration-logs
          path: |
            tetragon-agent.log
            test-runner.log
          retention-days: 14

      - name: Teardown
        if: always()
        run: |
          docker compose \
            -f test/e2e/tetragon/docker-compose.yml \
            down --volumes --remove-orphans
