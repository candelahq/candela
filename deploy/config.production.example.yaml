# Candela Production Configuration (Example)
# Copy to config.production.yaml and fill in your GCP project details.
# Deployed to Cloud Run via CANDELA_CONFIG env var.

server:
  host: "0.0.0.0"
  port: 8181

storage:
  backend: "bigquery"
  bigquery:
    project_id: "your-gcp-project-id"
    dataset: "candela"
    table: "spans"
    location: "US"

proxy:
  enabled: true
  project_id: "default"
  vertex_ai:
    project_id: "your-gcp-project-id"
    region: "us-east5"
    prompt_caching: true  # Shorthand for caching_mode: auto (~10x cost reduction)
    # caching_mode: auto  # Explicit alternative: off|auto|system-only
    # cache_ttl: "5m"     # Vertex AI cache TTL ("5m" or "1h")
    # Per-provider region/endpoint overrides for MaaS models with limited availability.
    provider_overrides:
      mistral:
        region: "us-central1"    # Mistral only in us-central1 & europe-west1
        # endpoint: "https://custom-endpoint.example.com"  # optional full URL override
  providers:
    - openai
    - google
    - anthropic
    - anthropic-vertex
    - anthropic-direct
    - anthropic-bedrock
    - gemini-oai
    - gemini-vertex
    - mistral
    - deepseek
    - qwen

# No CORS needed — UI and API are same-origin in combined container.
cors:
  allowed_origins: []

auth:
  dev_mode: true  # Cloud Run invoker IAM handles access control.
  # TODO: replace with Firebase Auth / Cloud Run ID token validation.

firestore:
  enabled: true
  project_id: "your-gcp-project-id"
  database_id: "candela"

worker:
  batch_size: 100
  flush_interval: "2s"
