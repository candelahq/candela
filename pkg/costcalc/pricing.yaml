# Default model pricing for Candela.
# This file is embedded at build time via //go:embed.
# To update pricing, edit this file — no Go code changes needed.
#
# Format: provider/model with pricing per million tokens.
# Tiered pricing: input_high/output_high apply above tier_threshold_tokens.
# Only include tiered/discount fields when non-zero.

models:
  # ── Google Gemini ─────────────────────────────────────────
  # Gemini 3.5 (latest, May 2026)
  - provider: google
    model: gemini-3.5-flash
    input_per_million: 1.50
    output_per_million: 9.00

  - provider: google
    model: gemini-3.6-flash
    input_per_million: 1.50
    output_per_million: 7.50

  - provider: google
    model: gemini-3.5-flash-lite
    input_per_million: 0.30
    output_per_million: 2.50

  # Gemini 3.1
  - provider: google
    model: gemini-3.1-pro
    input_per_million: 2.00
    output_per_million: 12.00
    input_per_million_high: 4.00
    output_per_million_high: 18.00
    tier_threshold_tokens: 200000

  - provider: google
    model: gemini-3.1-flash-lite
    input_per_million: 0.25
    output_per_million: 1.50

  # Gemini 2.5
  - provider: google
    model: gemini-2.5-pro
    input_per_million: 1.25
    output_per_million: 10.00
    input_per_million_high: 2.50
    output_per_million_high: 15.00
    tier_threshold_tokens: 200000

  - provider: google
    model: gemini-2.5-flash
    input_per_million: 0.30
    output_per_million: 2.50

  - provider: google
    model: gemini-2.5-flash-lite
    input_per_million: 0.10
    output_per_million: 0.40

  # ── Anthropic Claude ──────────────────────────────────────
  # Claude 4.6/4.7/4.8 (latest) — canonical dotted format.
  # Hyphenated variants (e.g. claude-opus-4-7 from Vertex AI) are
  # resolved via normalizeModelID in resolve(), not duplicated here.
  #
  # All Opus 4.x versions are $5/$25 per Anthropic pricing.
  # (Claude 3 Opus was $15/$75 — do NOT confuse the two.)
  - provider: anthropic
    model: claude-opus-4.8
    input_per_million: 5.00
    output_per_million: 25.00

  - provider: anthropic
    model: claude-opus-4.7
    input_per_million: 5.00
    output_per_million: 25.00

  - provider: anthropic
    model: claude-opus-4.6
    input_per_million: 5.00
    output_per_million: 25.00

  - provider: anthropic
    model: claude-sonnet-4.6
    input_per_million: 3.00
    output_per_million: 15.00

  - provider: anthropic
    model: claude-haiku-4.5
    input_per_million: 1.00
    output_per_million: 5.00

  # Claude 4 (short names — used by editors and Claude Code)
  - provider: anthropic
    model: claude-sonnet-4
    input_per_million: 3.00
    output_per_million: 15.00

  - provider: anthropic
    model: claude-opus-4
    input_per_million: 5.00
    output_per_million: 25.00

  # Claude 4 (Vertex AI model IDs with date suffix)
  - provider: anthropic
    model: claude-sonnet-4-20250514
    input_per_million: 3.00
    output_per_million: 15.00

  - provider: anthropic
    model: claude-opus-4-20250514
    input_per_million: 5.00
    output_per_million: 25.00

  # Claude Sonnet 5 (June 2026) — launch pricing through Aug 31, 2026.
  # Standard pricing ($3/$15) takes effect Sep 1, 2026.
  - provider: anthropic
    model: claude-sonnet-5
    input_per_million: 2.00
    output_per_million: 10.00

  # Claude Opus 5 (July 2026)
  - provider: anthropic
    model: claude-opus-5
    input_per_million: 5.00
    output_per_million: 25.00

  # ── OpenAI ───────────────────────────────────────────────
  # GPT-4.1 family (current flagship, 1M context)
  - provider: openai
    model: gpt-4.1
    input_per_million: 2.00
    output_per_million: 8.00

  - provider: openai
    model: gpt-4.1-mini
    input_per_million: 0.40
    output_per_million: 1.60

  - provider: openai
    model: gpt-4.1-nano
    input_per_million: 0.10
    output_per_million: 0.40

  # o-series reasoning models
  - provider: openai
    model: o3
    input_per_million: 2.00
    output_per_million: 8.00

  - provider: openai
    model: o4-mini
    input_per_million: 1.10
    output_per_million: 4.40

  # GPT-4o (legacy)
  - provider: openai
    model: gpt-4o
    input_per_million: 2.50
    output_per_million: 10.00

  - provider: openai
    model: gpt-4o-mini
    input_per_million: 0.15
    output_per_million: 0.60

  # ── Mistral (via Vertex AI rawPredict) ───────────────────
  - provider: mistral
    model: mistral-small-2503
    input_per_million: 0.10
    output_per_million: 0.30

  - provider: mistral
    model: mistral-medium-3
    input_per_million: 0.40
    output_per_million: 2.00

  - provider: mistral
    model: codestral-2
    input_per_million: 0.30
    output_per_million: 0.90

  # ── DeepSeek R1 (via Vertex AI, us-central1) ──────
  - provider: deepseek
    model: deepseek-r1-0528-maas
    input_per_million: 0.14
    output_per_million: 0.28

  # ── DeepSeek V3 (via Vertex AI, global) ──────
